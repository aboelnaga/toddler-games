name: toddler_games
description: Bilingual safe mini-games for 2+ year-olds
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  go_router_builder: ^4.3.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.5
  riverpod_generator: ^3.0.0
  riverpod_lint: ">=3.0.0 <3.1.0"
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
